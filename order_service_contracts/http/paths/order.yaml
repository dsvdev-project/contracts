get:
  summary: Получить заказ по UUID
  operationId: getOrder
  parameters:
    - $ref: "../parameters/OrderUUID.yaml"
  responses:
    "200":
      description: Заказ найден
      content:
        application/json:
          schema:
            $ref: "../schemas/Order.yaml"
    "404":
      description: Заказ не найден
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"