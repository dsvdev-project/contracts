post:
  summary: Оплатить заказ
  operationId: payOrder
  parameters:
    - $ref: "../parameters/OrderUUID.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/PayOrderRequest.yaml"
  responses:
    "200":
      description: Оплата проведена успешно
      content:
        application/json:
          schema:
            $ref: "../schemas/PayOrderResponse.yaml"
    "400":
      description: Некорректный запрос или ошибка платёжного сервиса
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
    "404":
      description: Заказ не найден
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"