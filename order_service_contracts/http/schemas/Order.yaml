type: object
required:
  - order_uuid
  - user_uuid
  - part_uuids
  - total_price
  - status
properties:
  order_uuid:
    type: string
    format: uuid
    description: Уникальный идентификатор заказа
  user_uuid:
    type: string
    format: uuid
    description: UUID пользователя
  part_uuids:
    type: array
    items:
      type: string
      format: uuid
    description: Список UUID деталей
  total_price:
    type: number
    format: double
    description: Итоговая стоимость заказа
  transaction_uuid:
    type: string
    format: uuid
    nullable: true
    description: UUID транзакции (заполняется после оплаты)
  payment_method:
    nullable: true
    description: Способ оплаты (заполняется после оплаты)
    allOf:
      - $ref: "./PaymentMethod.yaml"
  status:
    $ref: "./OrderStatus.yaml"