version: '3'

tasks:
  proto:
    desc: "Генерирует Go-код из всех proto-файлов"
    summary: |
      Полный пайплайн кодогенерации из .proto файлов:
        1. Устанавливает buf (если не установлен)
        2. Устанавливает локальные плагины protoc-gen-go и protoc-gen-go-grpc (если не установлены)
        3. Запускает кодогенерацию
    cmds:
      - task: install-buf
      - task: install-protoc-gen-go
      - task: install-protoc-gen-go-grpc
      - task: generate

  install-buf:
    desc: "Устанавливает buf (если не установлен)"
    summary: |
      Проверяет наличие buf в системе.
      Если не найден — устанавливает через go install (работает на Mac/Linux/Windows).
    cmds:
      - echo "📦 Устанавливаем buf..."
      - go install github.com/bufbuild/buf/cmd/buf@latest
    status:
      - buf --version

  install-protoc-gen-go:
    desc: "Устанавливает protoc-gen-go (если не установлен)"
    summary: |
      Устанавливает плагин protoc-gen-go для генерации *.pb.go файлов.
    cmds:
      - echo "📦 Устанавливаем protoc-gen-go..."
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
    status:
      - protoc-gen-go --version

  install-protoc-gen-go-grpc:
    desc: "Устанавливает protoc-gen-go-grpc (если не установлен)"
    summary: |
      Устанавливает плагин protoc-gen-go-grpc для генерации *_grpc.pb.go файлов.
    cmds:
      - echo "📦 Устанавливаем protoc-gen-go-grpc..."
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
    status:
      - protoc-gen-go-grpc --version

  generate:
    desc: "Запускает buf generate для всех proto-файлов"
    cmds:
      - echo "⚙️  Запускаем кодогенерацию..."
      - export PATH="$PATH:$(go env GOPATH)/bin" && buf generate
      - echo "✅ Кодогенерация завершена"

  openapi:
    desc: "Генерирует Go-код из OpenAPI-спецификаций"
    summary: |
      Полный пайплайн кодогенерации из OpenAPI .yaml файлов:
        1. Устанавливает oapi-codegen (если не установлен)
        2. Запускает кодогенерацию
    cmds:
      - task: install-oapi-codegen
      - task: generate-openapi

  install-oapi-codegen:
    desc: "Устанавливает oapi-codegen (если не установлен)"
    summary: |
      Устанавливает плагин oapi-codegen для генерации Go-кода из OpenAPI спецификаций.
    cmds:
      - echo "📦 Устанавливаем oapi-codegen..."
      - go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest
    status:
      - oapi-codegen --version

  generate-openapi:
    desc: "Запускает oapi-codegen для всех */http/openapi.yaml файлов"
    cmds:
      - echo "⚙️  Запускаем кодогенерацию OpenAPI..."
      - |
        export PATH="$PATH:$(go env GOPATH)/bin"
        for spec in $(find . -path "*_service_contracts/http/openapi.yaml" -not -path "./generated/*" | sort); do
          service=$(basename $(dirname $(dirname "$spec")) | sed 's/_service_contracts//')
          out_dir="generated/$(basename $(dirname $(dirname "$spec")))/http"
          mkdir -p "$out_dir"
          oapi-codegen -package "${service}http" -generate types,chi-server,client -o "$out_dir/openapi.gen.go" "$spec"
          echo "  ✓ $spec → $out_dir/openapi.gen.go (package ${service}http)"
        done
      - echo "✅ Кодогенерация OpenAPI завершена"